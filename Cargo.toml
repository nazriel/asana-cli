[package]
name = "asana-cli"
version = "0.1.0"
edition = "2024"
description = "A small, agent-friendly CLI for the Asana API"
license = "MIT"

[[bin]]
name = "asana"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
keyring = "4.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
