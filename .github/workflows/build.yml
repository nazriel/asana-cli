name: Build

# Release archives for every supported target. Called by CI on every push so
# the default branch keeps a warm cache per target, and by the release workflow
# with the same steps, so a tagged build restores that cache.
on:
  workflow_call:
    inputs:
      upload:
        description: Upload the archives as workflow artifacts
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dist:
    name: Dist ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.11
          install_args: rust mr-boxington

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      # After mise, so the cache key covers the pinned rustc. One cache series
      # per target keeps the two macOS targets from sharing an entry.
      - uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        with:
          cache-generation: dist-${{ matrix.target }}

      - run: mise run dist ${{ matrix.target }}

      - if: inputs.upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
