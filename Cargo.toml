[package]
name = "asana-cli"
version = "0.7.0"
edition = "2024"
description = "A small, agent-friendly CLI for the Asana API"
license = "MIT"

[[bin]]
name = "asana"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
directories = "6.0"
humantime = "2.2"
keyring = "4.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rpassword = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
